[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-diffusion-brain"
version = "0.1.0"
description = "Diffusion Policy for autonomous multirotor flight"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "opencv-python",
    "torch",
    "torchvision",
    "numpy",
    "omegaconf",
    "tqdm",
    "zarr<3.0.0",
    "numcodecs>=0.10.0",
    "gymnasium",
    "diffusers",
    "gym-pybullet-drones @ git+https://github.com/utiasDSL/gym-pybullet-drones.git",
    "kaddulive-blender-sim-env"
]

[tool.setuptools.packages.find]
include = ["models*", "configs*", "dataset*"]
